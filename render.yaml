# Render Blueprint: API + managed PostgreSQL. Frontend is deployed separately on Vercel (see README).
services:
  - type: web
    name: ish-haqqi-api
    runtime: node
    rootDir: server
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: ish-haqqi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SAMESITE
        value: lax
      - key: SESSION_HOURS
        value: "12"
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: ish-haqqi-db
    plan: free
    region: frankfurt
    databaseName: ishhaqqi
    user: ish
